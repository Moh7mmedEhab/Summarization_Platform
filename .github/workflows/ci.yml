name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: margins
          POSTGRES_PASSWORD: margins
          POSTGRES_DB: margins
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U margins"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://margins:margins@localhost:5432/margins
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      GEMINI_API_KEY: ""
      STORAGE_DIR: storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (runs prisma generate via postinstall)
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
